<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoGraph - 智能笔记图谱</title>
<style>
/* ===== CSS Variables & Theme ===== */
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-sidebar: #1a1a2e;
  --bg-card: #ffffff;
  --text-primary: #2d3436;
  --text-secondary: #636e72;
  --text-sidebar: #dfe6e9;
  --text-sidebar-active: #ffffff;
  --accent: #6c5ce7;
  --accent-hover: #5a4bd1;
  --accent-light: #a29bfe;
  --border: #e0e0e0;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --editor-bg: #ffffff;
  --editor-text: #2d3436;
  --preview-bg: #ffffff;
  --preview-text: #2d3436;
  --code-bg: #f1f2f6;
  --graph-bg: #f8f9fa;
  --graph-node: #6c5ce7;
  --graph-node-hover: #a29bfe;
  --graph-edge: #b2bec3;
  --graph-text: #2d3436;
  --tag-bg: #dfe6e9;
  --tag-text: #2d3436;
  --search-bg: #f1f2f6;
  --scrollbar: #c8d6e5;
}

[data-theme="dark"] {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-sidebar: #0f0f23;
  --bg-card: #1a1a2e;
  --text-primary: #dfe6e9;
  --text-secondary: #b2bec3;
  --text-sidebar: #b2bec3;
  --text-sidebar-active: #ffffff;
  --accent: #a29bfe;
  --accent-hover: #6c5ce7;
  --accent-light: #6c5ce7;
  --border: #2d3436;
  --shadow: 0 2px 10px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
  --editor-bg: #1a1a2e;
  --editor-text: #dfe6e9;
  --preview-bg: #1a1a2e;
  --preview-text: #dfe6e9;
  --code-bg: #16213e;
  --graph-bg: #16213e;
  --graph-node: #a29bfe;
  --graph-node-hover: #6c5ce7;
  --graph-edge: #636e72;
  --graph-text: #dfe6e9;
  --tag-bg: #2d3436;
  --tag-text: #dfe6e9;
  --search-bg: #16213e;
  --scrollbar: #2d3436;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  transition: var(--transition);
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ===== Sidebar ===== */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-sidebar);
  color: var(--text-sidebar);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: var(--transition);
  z-index: 10;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-sidebar-active);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-header h1 .logo-icon {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.sidebar-actions {
  display: flex;
  gap: 4px;
}

.sidebar-actions button {
  background: none;
  border: none;
  color: var(--text-sidebar);
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: var(--transition);
}

.sidebar-actions button:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-sidebar-active);
}

/* ===== Search ===== */
.search-box {
  padding: 12px 16px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border: none;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08);
  color: var(--text-sidebar-active);
  font-size: 13px;
  outline: none;
  transition: var(--transition);
}

.search-box input::placeholder { color: var(--text-sidebar); opacity: 0.6; }
.search-box input:focus { background: rgba(255,255,255,0.12); }
.search-box .search-icon {
  position: absolute;
  left: 26px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sidebar);
  opacity: 0.6;
  font-size: 14px;
  pointer-events: none;
}

/* ===== Note List ===== */
.note-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.note-item {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  margin-bottom: 2px;
  position: relative;
}

.note-item:hover { background: rgba(255,255,255,0.06); }
.note-item.active { background: rgba(108,92,231,0.2); }

.note-item .note-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-sidebar-active);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.note-item .note-preview {
  font-size: 12px;
  color: var(--text-sidebar);
  opacity: 0.7;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.note-item .note-meta {
  font-size: 11px;
  color: var(--text-sidebar);
  opacity: 0.5;
  margin-top: 4px;
  display: flex;
  gap: 8px;
}

.note-item .note-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 6px;
}

.note-item .note-tags .tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(162,155,254,0.15);
  color: var(--accent-light);
}

.note-item .delete-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 24px;
  height: 24px;
  border: none;
  background: none;
  color: var(--text-sidebar);
  opacity: 0;
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: var(--transition);
}

.note-item:hover .delete-btn { opacity: 0.5; }
.note-item .delete-btn:hover { opacity: 1; background: rgba(255,0,0,0.2); color: #ff6b6b; }

/* ===== Main Content ===== */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ===== Toolbar ===== */
.toolbar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-primary);
  gap: 12px;
  flex-wrap: wrap;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.toolbar button {
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--bg-primary);
  color: var(--text-primary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.toolbar button:hover {
  background: var(--bg-secondary);
  border-color: var(--accent);
  color: var(--accent);
}

.toolbar button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.toolbar button.primary:hover {
  background: var(--accent-hover);
}

.toolbar .view-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.toolbar .view-toggle button {
  border: none;
  border-radius: 0;
  padding: 6px 12px;
}

.toolbar .view-toggle button.active {
  background: var(--accent);
  color: white;
}

/* ===== Editor Area ===== */
.editor-area {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

.editor-pane, .preview-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.editor-pane {
  border-right: 1px solid var(--border);
}

.editor-pane textarea {
  flex: 1;
  width: 100%;
  padding: 20px;
  border: none;
  outline: none;
  resize: none;
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 14px;
  line-height: 1.7;
  background: var(--editor-bg);
  color: var(--editor-text);
  tab-size: 2;
}

.editor-pane textarea::placeholder {
  color: var(--text-secondary);
  opacity: 0.5;
}

.preview-pane {
  padding: 20px;
  overflow-y: auto;
  background: var(--preview-bg);
  color: var(--preview-text);
}

.preview-pane h1, .preview-pane h2, .preview-pane h3,
.preview-pane h4, .preview-pane h5, .preview-pane h6 {
  margin: 1.2em 0 0.6em;
  line-height: 1.3;
}

.preview-pane h1 { font-size: 1.8em; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
.preview-pane h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.preview-pane h3 { font-size: 1.25em; }
.preview-pane p { margin: 0.8em 0; line-height: 1.7; }
.preview-pane ul, .preview-pane ol { margin: 0.6em 0; padding-left: 1.5em; }
.preview-pane li { margin: 0.3em 0; }
.preview-pane blockquote {
  margin: 1em 0;
  padding: 12px 16px;
  border-left: 4px solid var(--accent);
  background: var(--code-bg);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.preview-pane code {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
  font-family: 'JetBrains Mono', 'Consolas', monospace;
}
.preview-pane pre {
  margin: 1em 0;
  padding: 16px;
  background: var(--code-bg);
  border-radius: var(--radius-sm);
  overflow-x: auto;
}
.preview-pane pre code {
  background: none;
  padding: 0;
}
.preview-pane a {
  color: var(--accent);
  text-decoration: none;
}
.preview-pane a:hover { text-decoration: underline; }
.preview-pane img { max-width: 100%; border-radius: var(--radius-sm); }
.preview-pane hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
.preview-pane table {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
}
.preview-pane th, .preview-pane td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  text-align: left;
}
.preview-pane th { background: var(--code-bg); font-weight: 600; }

/* Wiki link styling */
.wiki-link {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  border-bottom: 1px dashed var(--accent);
  padding: 0 2px;
  transition: var(--transition);
}
.wiki-link:hover {
  background: var(--accent);
  color: white;
  border-radius: 3px;
}
.wiki-link.missing {
  color: var(--text-secondary);
  border-bottom-color: var(--text-secondary);
  opacity: 0.7;
}

/* ===== Graph View ===== */
.graph-view {
  flex: 1;
  display: none;
  position: relative;
  background: var(--graph-bg);
}

.graph-view.active {
  display: block;
}

.graph-view canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.graph-info {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  padding: 8px 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  border: 1px solid var(--border);
}

/* ===== Empty State ===== */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  padding: 40px;
  text-align: center;
}

.empty-state .empty-icon {
  font-size: 64px;
  margin-bottom: 20px;
  opacity: 0.3;
}

.empty-state h2 {
  font-size: 20px;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.empty-state p {
  font-size: 14px;
  max-width: 400px;
  line-height: 1.6;
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 90%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  border: 1px solid var(--border);
}

.modal h2 {
  font-size: 18px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-secondary);
}

.modal input, .modal textarea, .modal select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
  margin-bottom: 16px;
  font-family: var(--font);
}

.modal input:focus, .modal textarea:focus, .modal select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
}

.modal textarea {
  min-height: 80px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 8px;
}

.modal-actions button {
  padding: 8px 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  transition: var(--transition);
  background: var(--bg-primary);
  color: var(--text-primary);
}

.modal-actions button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.modal-actions button.primary:hover { background: var(--accent-hover); }
.modal-actions button:hover { background: var(--bg-secondary); }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 12px 20px;
  background: var(--bg-card);
  color: var(--text-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  font-size: 14px;
  z-index: 200;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { width: 60px; min-width: 60px; }
  .sidebar-header h1 span, .note-item .note-preview,
  .note-item .note-meta, .note-item .note-tags,
  .search-box input { display: none; }
  .note-item { padding: 12px 8px; text-align: center; }
  .note-item .note-title { font-size: 12px; }
  .search-box { padding: 8px; }
  .search-box input { padding: 10px; }
  .search-box .search-icon { left: 18px; }
  .editor-pane { display: none; }
  .preview-pane { flex: 1; }
  .toolbar { padding: 8px 12px; }
  .toolbar button { font-size: 12px; padding: 4px 10px; }
}

/* ===== Loading ===== */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: var(--text-secondary);
}

.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>
      <span class="logo-icon">🧠</span>
      <span>MemoGraph</span>
    </h1>
    <div class="sidebar-actions">
      <button onclick="showNewNoteModal()" title="新建笔记">➕</button>
      <button onclick="toggleTheme()" title="切换主题" id="themeBtn">🌙</button>
    </div>
  </div>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索笔记..." oninput="searchNotes(this.value)">
  </div>

  <div class="note-list" id="noteList"></div>
</aside>

<!-- ===== Main Content ===== -->
<main class="main-content">
  <div class="toolbar">
    <div class="toolbar-left">
      <button onclick="showNewNoteModal()" class="primary">✏️ 新建笔记</button>
      <button onclick="showImportModal()">📥 导入</button>
      <button onclick="exportAll()">📤 导出</button>
    </div>
    <div class="toolbar-right">
      <div class="view-toggle">
        <button class="active" onclick="setView('editor')" id="viewEditor">📝 编辑</button>
        <button onclick="setView('graph')" id="viewGraph">🕸️ 图谱</button>
      </div>
    </div>
  </div>

  <!-- Editor View -->
  <div class="editor-area" id="editorView">
    <div class="editor-pane">
      <textarea id="editor" placeholder="在此编写 Markdown 笔记...

使用 [[笔记标题]] 创建双向链接
使用 #标签 添加标签" oninput="onEditorChange()"></textarea>
    </div>
    <div class="preview-pane" id="preview"></div>
  </div>

  <!-- Graph View -->
  <div class="graph-view" id="graphView">
    <canvas id="graphCanvas"></canvas>
    <div class="graph-info" id="graphInfo">拖动节点查看关联</div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">📝</div>
    <h2>欢迎使用 MemoGraph</h2>
    <p>点击「新建笔记」开始你的知识管理之旅。<br>使用 <code>[[笔记标题]]</code> 创建双向链接，<br>知识图谱会自动可视化你的笔记关联。</p>
  </div>
</main>

<!-- ===== New Note Modal ===== -->
<div class="modal-overlay" id="newNoteModal">
  <div class="modal">
    <h2>📝 新建笔记</h2>
    <label for="noteTitle">标题</label>
    <input type="text" id="noteTitle" placeholder="输入笔记标题" autofocus>
    <label for="noteTags">标签（用逗号分隔）</label>
    <input type="text" id="noteTags" placeholder="例如: 技术, JavaScript, 笔记">
    <div class="modal-actions">
      <button onclick="closeModal('newNoteModal')">取消</button>
      <button class="primary" onclick="createNote()">创建</button>
    </div>
  </div>
</div>

<!-- ===== Import Modal ===== -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h2>📥 导入笔记</h2>
    <p style="color: var(--text-secondary); margin-bottom: 16px; font-size: 14px;">选择 Markdown 文件导入为笔记（文件名将作为标题）</p>
    <input type="file" id="importFileInput" accept=".md" multiple>
    <div class="modal-actions">
      <button onclick="closeModal('importModal')">取消</button>
      <button class="primary" onclick="importFiles()">导入</button>
    </div>
  </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<script>
// ===== Markdown Parser (minimal) =====
function parseMarkdown(text) {
  if (!text) return '';

  // Escape HTML
  let html = text
    .replace(/&/g, '\x26amp;')
    .replace(/</g, '\x26lt;')
    .replace(/>/g, '\x26gt;');

  // Process wiki links [[Title]]
  html = html.replace(/\[\[([^\]]+)\]\]/g, (match, title) => {
    const exists = notes.some(n => n.title === title.trim());
    const cls = exists ? 'wiki-link' : 'wiki-link missing';
    const safeTitle = escapeHtml(title.trim());
    const quotedTitle = safeTitle.replace(/'/g, "\\'");
    return `<a class="${cls}" onclick="navigateToNote('${quotedTitle}')">${safeTitle}</a>`;
  });

  // Process tags #tag
  html = html.replace(/(^|\s)(#[^\s#]+)/g, '$1<span class="tag" style="background:var(--tag-bg);color:var(--tag-text);padding:2px 8px;border-radius:10px;font-size:0.85em;cursor:pointer;" onclick="searchNotes(\'$2\')">$2</span>');

  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headings
  html = html.replace(/^###### (.*$)/gm, '<h6>$1</h6>');
  html = html.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

  // Blockquotes
  html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Bold and italic
  html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

  // Images
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Unordered lists
  html = html.replace(/^(\s*)[-*+] (.*$)/gm, '$1<li>$2</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

  // Ordered lists
  html = html.replace(/^(\s*)\d+\. (.*$)/gm, '$1<li>$2</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ol>$&</ol>');

  // Paragraphs
  html = html.replace(/^(?!<[houblipr]|<\/[houblipr]|<li|<pre)(.*$)/gm, '<p>$1</p>');

  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');

  // Fix nested lists
  html = html.replace(/<\/ul>\s*<ul>/g, '');
  html = html.replace(/<\/ol>\s*<ol>/g, '');

  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g, '\x26amp;').replace(/</g, '\x26lt;').replace(/>/g, '\x26gt;').replace(/"/g, '\x26quot;');
}

// ===== Data Store =====
let notes = [];
let currentNoteId = null;
let currentView = 'editor';
let searchQuery = '';
let isDarkTheme = localStorage.getItem('memograph-theme') === 'dark';
let graphAnimationId = null;
let graphNodes = [];
let graphEdges = [];

// ===== IndexedDB =====
const DB_NAME = 'MemoGraphDB';
const DB_VERSION = 1;
const STORE_NAME = 'notes';

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function loadNotes() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const request = store.getAll();
    return new Promise((resolve, reject) => {
      request.onsuccess = () => {
        notes = request.result || [];
        resolve();
      };
      request.onerror = () => reject(request.error);
    });
  } catch (e) {
    console.error('Failed to load notes:', e);
    notes = [];
  }
}

async function saveNote(note) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put(note);
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    console.error('Failed to save note:', e);
  }
}

async function deleteNoteFromDB(id) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.delete(id);
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    console.error('Failed to delete note:', e);
  }
}

// ===== Note Operations =====
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function getCurrentTimestamp() {
  return new Date().toISOString();
}

function createNote() {
  const titleInput = document.getElementById('noteTitle');
  const tagsInput = document.getElementById('noteTags');
  const title = titleInput.value.trim();
  if (!title) {
    showToast('请输入笔记标题');
    return;
  }

  const tags = tagsInput.value.split(',').map(t => t.trim()).filter(t => t);
  const note = {
    id: generateId(),
    title: title,
    content: `# ${title}\n\n在此编写笔记内容...\n\n使用 [[笔记标题]] 创建链接`,
    tags: tags,
    createdAt: getCurrentTimestamp(),
    updatedAt: getCurrentTimestamp()
  };

  notes.push(note);
  saveNote(note);
  closeModal('newNoteModal');
  titleInput.value = '';
  tagsInput.value = '';
  selectNote(note.id);
  showToast(`已创建笔记「${title}」`);
  updateGraph();
}

function selectNote(id) {
  currentNoteId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return;

  document.getElementById('editor').value = note.content;
  updatePreview();
  renderNoteList();
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorView').style.display = 'flex';
  document.getElementById('graphView').style.display = 'none';
  currentView = 'editor';
  document.getElementById('viewEditor').classList.add('active');
  document.getElementById('viewGraph').classList.remove('active');
}

function deleteNote(id) {
  if (!confirm('确定要删除这篇笔记吗？')) return;
  const note = notes.find(n => n.id === id);
  notes = notes.filter(n => n.id !== id);
  deleteNoteFromDB(id);
  if (currentNoteId === id) {
    currentNoteId = null;
    document.getElementById('editor').value = '';
    document.getElementById('preview').innerHTML = '';
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('editorView').style.display = 'none';
    document.getElementById('graphView').style.display = 'none';
  }
  renderNoteList();
  updateGraph();
  showToast(`已删除笔记「${note ? note.title : ''}」`);
}

function onEditorChange() {
  const content = document.getElementById('editor').value;
  const note = notes.find(n => n.id === currentNoteId);
  if (note) {
    note.content = content;
    note.updatedAt = getCurrentTimestamp();
    saveNote(note);
    updatePreview();
    renderNoteList();
    updateGraph();
  }
}

function updatePreview() {
  const content = document.getElementById('editor').value;
  document.getElementById('preview').innerHTML = parseMarkdown(content);
}

function navigateToNote(title) {
  const note = notes.find(n => n.title === title);
  if (note) {
    selectNote(note.id);
  }
}

function searchNotes(query) {
  searchQuery = query.trim();
  renderNoteList();
}

function getFilteredNotes() {
  if (!searchQuery) return notes;
  const q = searchQuery.toLowerCase();
  return notes.filter(n =>
    n.title.toLowerCase().includes(q) ||
    n.content.toLowerCase().includes(q) ||
    (n.tags && n.tags.some(t => t.toLowerCase().includes(q)))
  );
}

// ===== Render =====
function renderNoteList() {
  const list = document.getElementById('noteList');
  const filtered = getFilteredNotes();

  if (filtered.length === 0) {
    list.innerHTML = `
      <div style="padding: 20px; text-align: center; color: var(--text-sidebar); opacity: 0.5; font-size: 13px;">
        ${searchQuery ? '没有找到匹配的笔记' : '还没有笔记，点击 + 创建'}
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(note => {
    const isActive = note.id === currentNoteId;
    const preview = note.content.replace(/[#*\[\]]/g, '').substring(0, 60);
    const time = new Date(note.updatedAt).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const tags = note.tags || [];

    return `
      <div class="note-item ${isActive ? 'active' : ''}" onclick="selectNote('${note.id}')">
        <div class="note-title">${escapeHtml(note.title)}</div>
        <div class="note-preview">${escapeHtml(preview)}</div>
        <div class="note-meta">
          <span>🕐 ${time}</span>
          ${tags.length > 0 ? `<span>🏷️ ${tags.join(', ')}</span>` : ''}
        </div>
        ${tags.length > 0 ? `
          <div class="note-tags">
            ${tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}
          </div>
        ` : ''}
        <button class="delete-btn" onclick="event.stopPropagation(); deleteNote('${note.id}')">✕</button>
      </div>
    `;
  }).join('');
}

// ===== Graph =====
function updateGraph() {
  if (currentView !== 'graph') return;
  buildGraph();
  renderGraph();
}

function buildGraph() {
  graphNodes = [];
  graphEdges = [];
  const nodeMap = {};

  notes.forEach(note => {
    const node = {
      id: note.id,
      label: note.title,
      x: Math.random() * 800 + 50,
      y: Math.random() * 500 + 50,
      vx: 0,
      vy: 0,
      radius: 20 + Math.min(note.title.length * 2, 30)
    };
    graphNodes.push(node);
    nodeMap[note.id] = node;
  });

  // Extract links from content
  notes.forEach(note => {
    const links = note.content.match(/\[\[([^\]]+)\]\]/g) || [];
    links.forEach(link => {
      const title = link.slice(2, -2).trim();
      const target = notes.find(n => n.title === title);
      if (target) {
        graphEdges.push({
          source: note.id,
          target: target.id
        });
      }
    });
  });
}

function renderGraph() {
  const canvas = document.getElementById('graphCanvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  if (graphAnimationId) {
    cancelAnimationFrame(graphAnimationId);
  }

  let isDragging = false;
  let dragNode = null;
  let mouseX = 0, mouseY = 0;

  function simulate() {
    // Simple force-directed layout
    const repulsion = 5000;
    const attraction = 0.005;
    const damping = 0.9;

    // Repulsion between nodes
    for (let i = 0; i < graphNodes.length; i++) {
      for (let j = i + 1; j < graphNodes.length; j++) {
        const a = graphNodes[i];
        const b = graphNodes[j];
        let dx = a.x - b.x;
        let dy = a.y - b.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let force = repulsion / (dist * dist);
        let fx = (dx / dist) * force;
        let fy = (dy / dist) * force;
        a.vx += fx;
        a.vy += fy;
        b.vx -= fx;
        b.vy -= fy;
      }
    }

    // Attraction along edges
    graphEdges.forEach(edge => {
      const source = graphNodes.find(n => n.id === edge.source);
      const target = graphNodes.find(n => n.id === edge.target);
      if (!source || !target) return;
      let dx = target.x - source.x;
      let dy = target.y - source.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = (dist - 100) * attraction;
      let fx = (dx / dist) * force;
      let fy = (dy / dist) * force;
      source.vx += fx;
      source.vy += fy;
      target.vx -= fx;
      target.vy -= fy;
    });

    // Center gravity
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    graphNodes.forEach(node => {
      if (node === dragNode) return;
      node.vx += (cx - node.x) * 0.001;
      node.vy += (cy - node.y) * 0.001;
      node.vx *= damping;
      node.vy *= damping;
      node.x += node.vx;
      node.y += node.vy;
      // Keep in bounds
      node.x = Math.max(node.radius, Math.min(canvas.width - node.radius, node.x));
      node.y = Math.max(node.radius, Math.min(canvas.height - node.radius, node.y));
    });

    draw();
    graphAnimationId = requestAnimationFrame(simulate);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw edges
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--graph-edge').trim() || '#b2bec3';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.4;
    graphEdges.forEach(edge => {
      const source = graphNodes.find(n => n.id === edge.source);
      const target = graphNodes.find(n => n.id === edge.target);
      if (!source || !target) return;
      ctx.beginPath();
      ctx.moveTo(source.x, source.y);
      ctx.lineTo(target.x, target.y);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Draw nodes
    graphNodes.forEach(node => {
      const isActive = node.id === currentNoteId;
      const radius = isActive ? node.radius + 5 : node.radius;

      // Glow for active
      if (isActive) {
        ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6c5ce7';
        ctx.shadowBlur = 20;
      }

      // Node circle
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = isActive
        ? (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6c5ce7')
        : (getComputedStyle(document.documentElement).getPropertyValue('--graph-node').trim() || '#6c5ce7');
      ctx.fill();

      ctx.shadowBlur = 0;

      // Label
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--graph-text').trim() || '#2d3436';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const maxWidth = radius * 2 - 8;
      let label = node.label;
      if (ctx.measureText(label).width > maxWidth) {
        while (ctx.measureText(label + '…').width > maxWidth && label.length > 1) {
          label = label.slice(0, -1);
        }
        label += '…';
      }
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, node.x, node.y);
    });

    // Update info
    document.getElementById('graphInfo').textContent =
      `${graphNodes.length} 个节点 · ${graphEdges.length} 条连接`;
  }

  // Mouse events
  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    dragNode = graphNodes.find(n => {
      const dx = mouseX - n.x;
      const dy = mouseY - n.y;
      return Math.sqrt(dx * dx + dy * dy) < n.radius + 5;
    });
    if (dragNode) {
      isDragging = true;
    }
  };

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    if (isDragging && dragNode) {
      dragNode.x = mouseX;
      dragNode.y = mouseY;
    }
  };

  canvas.onmouseup = () => {
    isDragging = false;
    dragNode = null;
  };

  canvas.ondblclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const node = graphNodes.find(n => {
      const dx = x - n.x;
      const dy = y - n.y;
      return Math.sqrt(dx * dx + dy * dy) < n.radius + 5;
    });
    if (node) {
      selectNote(node.id);
    }
  };

  simulate();
}

// ===== View =====
function setView(view) {
  currentView = view;
  document.getElementById('viewEditor').classList.toggle('active', view === 'editor');
  document.getElementById('viewGraph').classList.toggle('active', view === 'graph');
  document.getElementById('editorView').style.display = view === 'editor' ? 'flex' : 'none';
  document.getElementById('graphView').style.display = view === 'graph' ? 'block' : 'none';

  if (view === 'graph') {
    buildGraph();
    renderGraph();
  } else if (graphAnimationId) {
    cancelAnimationFrame(graphAnimationId);
  }
}

// ===== Theme =====
function toggleTheme() {
  isDarkTheme = !isDarkTheme;
  document.documentElement.setAttribute('data-theme', isDarkTheme ? 'dark' : 'light');
  localStorage.setItem('memograph-theme', isDarkTheme ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isDarkTheme ? '☀️' : '🌙';
  if (currentView === 'graph') {
    buildGraph();
    renderGraph();
  }
}

// ===== Import/Export =====
function showImportModal() {
  document.getElementById('importModal').classList.add('active');
}

function importFiles() {
  const input = document.getElementById('importFileInput');
  const files = input.files;
  if (files.length === 0) {
    showToast('请选择文件');
    return;
  }

  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const content = e.target.result;
      const title = file.name.replace(/\.md$/i, '');
      const note = {
        id: generateId(),
        title: title,
        content: content,
        tags: [],
        createdAt: getCurrentTimestamp(),
        updatedAt: getCurrentTimestamp()
      };
      notes.push(note);
      saveNote(note);
      renderNoteList();
      updateGraph();
    };
    reader.readAsText(file);
  });

  closeModal('importModal');
  input.value = '';
  showToast(`已导入 ${files.length} 个文件`);
}

function exportAll() {
  if (notes.length === 0) {
    showToast('没有笔记可导出');
    return;
  }

  const data = JSON.stringify(notes, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `memograph-export-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${notes.length} 篇笔记`);
}

// ===== Modal =====
function showNewNoteModal() {
  document.getElementById('newNoteModal').classList.add('active');
  document.getElementById('noteTitle').focus();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', (e) => {
    if (e.target === el) el.classList.remove('active');
  });
});

// Enter key in new note modal
document.getElementById('noteTitle').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') createNote();
});

// ===== Toast =====
let toastTimeout;

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== Init =====
async function init() {
  // Apply theme
  if (isDarkTheme) {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }

  await loadNotes();
  renderNoteList();

  if (notes.length > 0) {
    selectNote(notes[0].id);
  } else {
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('editorView').style.display = 'none';
    document.getElementById('graphView').style.display = 'none';
  }

  // Handle window resize for graph
  window.addEventListener('resize', () => {
    if (currentView === 'graph') {
      buildGraph();
      renderGraph();
    }
  });
}

init();
